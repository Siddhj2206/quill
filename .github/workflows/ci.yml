name: ci

on:
  push:
    branches: [master, "ci/**"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: [self-hosted, pluto, linux]
    timeout-minutes: 15
    env:
      # Placeholder values so the build can validate its environment. Not real secrets.
      BETTER_AUTH_SECRET: ci-only-not-a-real-secret-0123456789abcdef
      BETTER_AUTH_URL: http://localhost:3001
      DATABASE_URL: mongodb://localhost:27017/quill?replicaSet=rs0
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run db:generate
      - run: bun run check-types
      - run: bun run lint
      - run: bun run build
